# Standalone crate: deliberately NOT a member of the repo's root Cargo
# workspace. It targets wasm32-unknown-unknown and depends on a vendored,
# patched alacritty_terminal, neither of which belongs in the native service
# workspace. The [workspace] table below is what declares that; its `exclude`
# keeps the vendored crate out of this crate's own workspace too.
[workspace]
exclude = ["vendor/alacritty_terminal"]

[package]
name = "terminal-core"
version = "0.1.0"
edition = "2021"
rust-version = "1.85.0"
license = "Apache-2.0"
publish = false

[lib]
crate-type = ["cdylib", "rlib"]

[package.metadata.wasm-pack.profile.release]
wasm-opt = false

[dependencies]
alacritty_terminal = { path = "vendor/alacritty_terminal", default-features = false }
vte = { version = "0.15", default-features = false, features = ["std", "ansi"] }
wasm-bindgen = "0.2"
js-sys = "0.3"

[lints.rust]
dead_code = "deny"
unused_imports = "deny"
unused_variables = "deny"
